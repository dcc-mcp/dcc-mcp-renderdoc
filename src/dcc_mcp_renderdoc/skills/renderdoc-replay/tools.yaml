tools:
  - name: describe_capture
    description: Open one .rdc capture for replay and report RenderDoc's own view of it — API pipeline type, renderer and vendor, replay capability flags (pixel history, shader debugging, remote replay), frame information, resource, texture, buffer, root-action and total-action counts, and first/last event IDs. Use as the first step of any replay workflow to learn the capture size before paging. Not for chunk-level offline triage — use renderdoc_analysis__inspect_capture.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/describe_capture.py
    next-tools:
      on-success: [renderdoc_replay__list_actions, renderdoc_replay__list_resources]
      on-failure: [renderdoc_analysis__inspect_capture, dcc_diagnostics__audit_log]
  - name: list_actions
    description: Walk the RenderDoc action tree and return a flat, paged list of actions with event ID, action ID, parent event ID, depth, resolved name, action flags, index and instance counts, and child count. Supports max_depth, name_filter substring matching, flag_filter matching against decoded action flag names, offset, and limit. Use for event and draw traversal, marker region discovery, and locating the event ID other replay tools need. Not for GPU timing or pipeline state.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        parent_event_id: {type: integer, minimum: 1}
        max_depth: {type: integer, minimum: 0, maximum: 32, default: 32}
        name_filter: {type: string, maxLength: 200}
        flag_filter: {type: string, maxLength: 100}
        offset: {type: integer, minimum: 0, maximum: 10000000, default: 0}
        limit: {type: integer, minimum: 1, maximum: 20000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/list_actions.py
    next-tools:
      on-success: [renderdoc_replay__get_action, renderdoc_replay__get_pipeline_state]
      on-failure: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
  - name: get_action
    description: Return full detail for one RenderDoc event — resolved name, custom name, decoded action flags, index, vertex, instance and draw offsets, dispatch dimensions and base, colour outputs, depth output, and copy source and destination. Use to inspect a single draw, dispatch, copy, or marker found through list_actions. Not for the resources bound at that event — use renderdoc_replay__get_pipeline_state.
    input_schema:
      type: object
      required: [capture_file, event_id]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        event_id: {type: integer, minimum: 1}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_action.py
    next-tools:
      on-success: [renderdoc_replay__get_pipeline_state, renderdoc_replay__get_mesh_data]
      on-failure: [renderdoc_replay__list_actions, dcc_diagnostics__audit_log]
  - name: list_resources
    description: List the resources in one capture with resource ID, name, type, byte size, and — for textures — width, height, depth, array size, mip count, format name, and dimension. Supports resource_type and name_filter substring matching, offset, and limit. Use to find the resource ID other replay tools need. Not for per-event bindings — use renderdoc_replay__get_pipeline_state.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        resource_type: {type: string, maxLength: 100}
        name_filter: {type: string, maxLength: 200}
        offset: {type: integer, minimum: 0, maximum: 10000000, default: 0}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/list_resources.py
    next-tools:
      on-success: [renderdoc_replay__get_resource_usage, renderdoc_replay__get_texture_data]
      on-failure: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
  - name: get_resource_usage
    description: Report every event that uses one resource, with the RenderDoc usage role for each (vertex buffer, index buffer, colour target, depth target, shader resource, constant buffer, copy source or destination, and so on). Use to answer which draw touched a texture or buffer. Not for the values stored in the resource.
    input_schema:
      type: object
      required: [capture_file, resource_id]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        resource_id: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_resource_usage.py
    next-tools:
      on-success: [renderdoc_replay__get_action, renderdoc_replay__get_pipeline_state]
      on-failure: [renderdoc_replay__list_resources, dcc_diagnostics__audit_log]
  - name: get_pipeline_state
    description: Move the replay to one event and report the full pipeline state — bound shader resource ID, entry point, and encoding per stage; index buffer; vertex buffers and vertex inputs; colour and depth output targets; viewport and scissor; colour blends, depth-test, and rasterizer state; and read-only, read-write, and constant-block bindings per stage. Use to understand what a draw was about to do. Not for shader source or reflection signatures — use renderdoc_replay__get_shader_info.
    input_schema:
      type: object
      required: [capture_file, event_id]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        event_id: {type: integer, minimum: 1}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_pipeline_state.py
    next-tools:
      on-success: [renderdoc_replay__get_shader_info, renderdoc_replay__get_mesh_data]
      on-failure: [renderdoc_replay__list_actions, dcc_diagnostics__audit_log]
  - name: get_shader_info
    description: Return reflection for one shader stage at one event — shader resource ID, entry point, stage, encoding, input and output signatures, constant blocks, read-only and read-write resources, and samplers. Set include_source for embedded shader source files and include_disassembly for RenderDoc disassembly, optionally with disassembly_target. Use to inspect what a shader declares. Not for constant buffer values at the event.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        event_id: {type: integer, minimum: 1}
        stage: {type: string, enum: [Vertex, Hull, Domain, Geometry, Pixel, Compute], default: Pixel}
        include_source: {type: boolean, default: false}
        include_disassembly: {type: boolean, default: false}
        disassembly_target: {type: string, maxLength: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_shader_info.py
    next-tools:
      on-success: [renderdoc_replay__get_pipeline_state, renderdoc_replay__get_debug_messages]
      on-failure: [renderdoc_replay__get_pipeline_state, dcc_diagnostics__audit_log]
  - name: get_texture_data
    description: Save one texture resource of a capture to an image file using RenderDoc's own texture export. Extension selects the format — png, jpg, bmp, tga, dds, exr, hdr, or raw. Supports mip and slice selection and an optional type_cast (Typeless, Float, UNorm, SNorm, UNormSRGB, UScaled, SScaled, UInt, SInt, Depth). Use for visual and offline review of a specific resource. Not for the embedded capture thumbnail — use renderdoc_analysis__export_thumbnail.
    input_schema:
      type: object
      required: [capture_file, resource_id, output_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        resource_id: {type: integer, minimum: 1}
        output_file: {type: string, minLength: 1, maxLength: 1000}
        mip: {type: integer, minimum: 0, maximum: 64, default: 0}
        slice_index: {type: integer, minimum: 0, maximum: 65535, default: 0}
        type_cast: {type: string, maxLength: 32, default: Typeless}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_texture_data.py
    next-tools:
      on-success: [renderdoc_replay__list_resources, renderdoc_replay__get_pixel_history]
      on-failure: [renderdoc_replay__list_resources, dcc_diagnostics__audit_log]
  - name: get_buffer_data
    description: Read a byte range of one buffer resource and return its length, a hex preview, a base64 preview, and optionally the full bytes written to output_file. Use to inspect constant buffers, vertex buffers, and index buffers. Not for decoded vertex positions — use renderdoc_replay__get_mesh_data.
    input_schema:
      type: object
      required: [capture_file, resource_id]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        resource_id: {type: integer, minimum: 1}
        offset: {type: integer, minimum: 0, default: 0}
        length: {type: integer, minimum: 0, maximum: 1073741824, default: 0}
        preview_bytes: {type: integer, minimum: 0, maximum: 4096, default: 256}
        output_file: {type: string, maxLength: 1000}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_buffer_data.py
    next-tools:
      on-success: [renderdoc_replay__get_resource_usage, renderdoc_replay__get_mesh_data]
      on-failure: [renderdoc_replay__list_resources, dcc_diagnostics__audit_log]
  - name: get_mesh_data
    description: Read the geometry pipeline output of one event through RenderDoc's mesh viewer data — stage VSIn, VSOut, GSOut, TaskOut, or MeshOut, plus instance and multiview view selection — and return the mesh format, topology, index and vertex buffer IDs with byte offsets and strides, and a best-effort decoded float vertex list. Use to check geometry transformation. Not for pixel-level results — use renderdoc_replay__get_pixel_history.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        event_id: {type: integer, minimum: 1}
        stage: {type: string, enum: [VSIn, VSOut, GSOut, TaskOut, MeshOut], default: VSOut}
        instance: {type: integer, minimum: 0, maximum: 65535, default: 0}
        view: {type: integer, minimum: 0, maximum: 65535, default: 0}
        max_vertices: {type: integer, minimum: 1, maximum: 4096, default: 256}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_mesh_data.py
    next-tools:
      on-success: [renderdoc_replay__get_pipeline_state, renderdoc_replay__get_buffer_data]
      on-failure: [renderdoc_replay__list_actions, dcc_diagnostics__audit_log]
  - name: get_pixel_history
    description: Return RenderDoc's pixel history for one pixel of one texture at one event — every modification with event ID, primitive, fragment index, pass or rejection reasons (depth, stencil, scissor, backface, shader discard, unbound pixel shader), and the pre, post, and shader-out values. Coordinates are always top-left. Requires a replay that reports pixel history support. Use to explain why a pixel has the colour it has. Not for stepping through shader execution — use renderdoc_replay__debug_pixel.
    input_schema:
      type: object
      required: [capture_file, resource_id, x, y]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        resource_id: {type: integer, minimum: 1}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        event_id: {type: integer, minimum: 1}
        mip: {type: integer, minimum: 0, maximum: 64, default: 0}
        slice_index: {type: integer, minimum: 0, maximum: 65535, default: 0}
        sample: {type: integer, minimum: 0, maximum: 65535, default: 0}
        type_cast: {type: string, maxLength: 32, default: Typeless}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 600
    source_file: scripts/get_pixel_history.py
    next-tools:
      on-success: [renderdoc_replay__debug_pixel, renderdoc_replay__get_action]
      on-failure: [renderdoc_replay__list_resources, dcc_diagnostics__audit_log]
  - name: debug_pixel
    description: Run RenderDoc's pixel shader debugger for one pixel of the current event and return the trace stage, step count, and a paged list of debug steps with step index, next instruction, flags, and changed variables. Coordinates are always top-left. Requires a replay that reports shader debugging support. Use to step through why a shader produced a value. Not for the list of events that touched a pixel — use renderdoc_replay__get_pixel_history.
    input_schema:
      type: object
      required: [capture_file, x, y]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        event_id: {type: integer, minimum: 1}
        sample: {type: integer, minimum: 0, maximum: 65535, default: 0}
        primitive: {type: integer, minimum: 0, default: 0}
        view: {type: integer, minimum: 0, maximum: 65535, default: 0}
        max_steps: {type: integer, minimum: 1, maximum: 20000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 900
    source_file: scripts/debug_pixel.py
    next-tools:
      on-success: [renderdoc_replay__get_pixel_history, renderdoc_replay__get_shader_info]
      on-failure: [renderdoc_replay__get_pixel_history, dcc_diagnostics__audit_log]
  - name: get_counters
    description: Enumerate the GPU counters RenderDoc exposes for one capture with name, category, description, unit, and result type. Set fetch=true — optionally with counter_ids — to sample counter values at an event. Use for counter availability and per-event sampling. Not for authoritative GPU duration measurement.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        event_id: {type: integer, minimum: 1}
        fetch: {type: boolean, default: false}
        counter_ids:
          type: array
          maxItems: 256
          items: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 600
    source_file: scripts/get_counters.py
    next-tools:
      on-success: [renderdoc_replay__get_action, renderdoc_replay__get_pipeline_state]
      on-failure: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
  - name: get_debug_messages
    description: Return the diagnostic messages RenderDoc generated during replay, with event ID, category, severity, source, message ID, and description. Use to surface API validation errors and replay warnings. Note that RenderDoc returns each message only once, so a second call reports newly generated messages.
    input_schema:
      type: object
      required: [capture_file]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        limit: {type: integer, minimum: 1, maximum: 5000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: false
    execution: async
    affinity: any
    timeout_hint_secs: 300
    source_file: scripts/get_debug_messages.py
    next-tools:
      on-success: [renderdoc_replay__get_action, renderdoc_replay__get_shader_info]
      on-failure: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
  - name: run_python_script
    description: Execute caller-supplied Python inside RenderDoc's bundled interpreter with renderdoc available as rd, the replay controller as controller, the qrenderdoc capture context as pyrenderdoc, and params. Assign to result to return structured data; captured stdout is returned. Use as the escape hatch for RenderDoc capabilities this adapter does not expose as a typed tool. Only run scripts you trust — the code runs with the adapter's privileges on the host.
    input_schema:
      type: object
      required: [capture_file, source]
      properties:
        capture_file: {type: string, minLength: 1, maxLength: 1000}
        source: {type: string, minLength: 1, maxLength: 100000}
        event_id: {type: integer, minimum: 1}
        args: {type: object}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: async
    affinity: any
    timeout_hint_secs: 900
    source_file: scripts/run_python_script.py
    next-tools:
      on-success: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
      on-failure: [renderdoc_replay__describe_capture, dcc_diagnostics__audit_log]
